<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Konfab</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <section class="chat">
        <header>
          <h1>Konfab</h1>
          <p id="room"></p>
          <p id="notice" class="notice" hidden></p>
        </header>
        <ol id="messages" aria-live="polite"></ol>
        <div class="composer">
          <label for="body">Message</label>
          <textarea
            id="body"
            rows="3"
            placeholder="Message the room, or use @claude, @codex, @all"
          ></textarea>
          <button id="send" type="button">Send</button>
        </div>
      </section>
      <aside>
        <h2>Agents</h2>
        <div id="agents"></div>
      </aside>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
